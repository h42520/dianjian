<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>仪器设备点检系统</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:15px}
.wrap{max-width:720px;margin:0 auto;background:#fff;min-height:100vh}
.head{background:#1e6fe8;color:#fff;padding:14px 16px}
.head h1{font-size:17px;margin:0 0 2px}
.head .sub{font-size:12px;opacity:.9}
.card{padding:14px 16px;border-bottom:1px solid #eee}
.card h2{font-size:14px;margin:0 0 10px;color:#1e6fe8}
/* 仪器选择器 */
.sel-btn{width:100%;padding:16px;background:#f7f9fc;border:1px solid #d6e0f0;border-radius:10px;font-size:15px;text-align:left;color:#333;position:relative}
.sel-btn:after{content:"▾";position:absolute;right:14px;color:#999}
.sel-btn .t{font-weight:600;font-size:16px}
.sel-btn .c{font-size:12px;color:#888;margin-top:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;flex-direction:column}
.modal.show{display:flex}
.modal-head{background:#1e6fe8;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-head .x{font-size:22px}
.modal-body{background:#fff;flex:1;overflow:auto}
.search{position:sticky;top:0;padding:10px;background:#fff;border-bottom:1px solid #eee}
.search input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px}
.inst-item{padding:13px 16px;border-bottom:1px solid #f2f2f2;cursor:pointer}
.inst-item:active{background:#f0f6ff}
.inst-item .t{font-weight:600}
.inst-item .c{font-size:12px;color:#888;margin-top:2px}
/* 年月选择 */
.ym{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ym select{padding:8px 10px;font-size:15px;border:1px solid #ddd;border-radius:8px;background:#fff}
.ym .today{flex:1;text-align:right;font-size:12px;color:#1e6fe8;text-decoration:none}
.legend{font-size:12px;color:#666;margin:2px 0 8px}
.legend span{margin-right:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:middle}
/* 日历 */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid .wd{text-align:center;font-size:12px;color:#999;padding:4px 0;font-weight:600}
.day{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f7f9fc;font-size:14px;cursor:pointer;border:1px solid transparent}
.day.empty{visibility:hidden}
.day.past{border-color:#e0e0e0}
.day.today{border-color:#1e6fe8;background:#e8f1ff;font-weight:700;color:#1e6fe8}
.day.future{color:#ccc;background:#fafafa;cursor:not-allowed}
.day.done:after{content:"";position:absolute;bottom:4px;width:7px;height:7px;border-radius:50%;background:#2ecc71}
.day.abnormal:after{content:"";position:absolute;bottom:4px;width:7px;height:7px;border-radius:50%;background:#e74c3c}
/* 点检弹层 */
.sheet{display:none;position:fixed;inset:0;background:#fff;z-index:200;flex-direction:column}
.sheet.show{display:flex}
.sheet-head{padding:14px 16px;background:#1e6fe8;color:#fff;display:flex;justify-content:space-between;align-items:center}
.sheet-head .x{font-size:24px}
.sheet-head .info{font-size:13px;line-height:1.5}
.sheet-head .info b{font-size:15px}
.sheet-body{flex:1;overflow:auto;padding:0 0 20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #e5e5e5;padding:8px 6px;text-align:center;vertical-align:middle}
th{background:#f0f5ff;font-size:12px;color:#555}
td.item{text-align:left;font-size:12px;line-height:1.4;max-width:150px}
.pick{display:flex;gap:4px;justify-content:center}
.pick button{flex:1;min-width:0;padding:7px 0;border:1px solid #ddd;background:#fff;border-radius:6px;font-size:15px;cursor:pointer}
.pick button.on-v{background:#2ecc71;color:#fff;border-color:#2ecc71}
.pick button.on-x{background:#e74c3c;color:#fff;border-color:#e74c3c}
.pick button.on-t{background:#f39c12;color:#fff;border-color:#f39c12}
.sign{display:none;padding:12px 16px;background:#f7f9fc;border-top:1px solid #eee;gap:8px;flex-wrap:wrap}
.sign.show{display:flex}
.sign input{flex:1;min-width:120px;padding:9px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.bar{position:sticky;bottom:0;background:#fff;padding:12px 16px;border-top:1px solid #eee;display:flex;gap:10px}
.bar button{flex:1;padding:13px;border:none;border-radius:9px;font-size:15px;font-weight:600}
.bar .submit{background:#1e6fe8;color:#fff}
.bar .submit:disabled{background:#bcc8da;color:#fff}
.bar .export{background:#fff;color:#1e6fe8;border:1px solid #1e6fe8}
.note{font-size:11px;color:#999;padding:8px 16px;line-height:1.6}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 22px;border-radius:8px;font-size:15px;z-index:999;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>仪器设备点检系统</h1>
    <div class="sub">惠州市新力德实业有限公司 · 实验室</div>
  </div>

  <div class="card">
    <h2>① 选择仪器</h2>
    <button class="sel-btn" id="selBtn">
      <div class="t" id="selTitle">请选择仪器（共 26 台）</div>
      <div class="c" id="selCode">点击展开列表，可搜索</div>
    </button>
  </div>

  <div class="card" id="dateCard" style="display:none">
    <h2>② 选择点检日期</h2>
    <div class="ym">
      <select id="yearSel"></select>
      <select id="monthSel"></select>
      <a class="today" href="#" id="todayBtn">回到今天</a>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#2ecc71"></i>已点检(正常)</span>
      <span><i class="dot" style="background:#e74c3c"></i>含异常</span>
      <span style="color:#1e6fe8">蓝框=今天</span>
    </div>
    <div class="grid" id="grid">
      <div class="wd">日</div><div class="wd">一</div><div class="wd">二</div><div class="wd">三</div>
      <div class="wd">四</div><div class="wd">五</div><div class="wd">六</div>
    </div>
    <div class="note">规则：可选今天及过去的日期补录；<b>未来的日期不可点检</b>。</div>
  </div>

  <div class="bar" id="bar" style="display:none">
    <button class="export" id="exportBtn">导出 Excel</button>
  </div>
</div>

<!-- 仪器列表弹层 -->
<div class="modal" id="instModal">
  <div class="modal-head"><span>选择仪器</span><span class="x" id="instClose">&times;</span></div>
  <div class="search"><input id="instSearch" placeholder="搜索编号或名称…"></div>
  <div class="modal-body" id="instList"></div>
</div>

<!-- 点检弹层 -->
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="info" id="sheetInfo"></div>
    <span class="x" id="sheetClose">&times;</span>
  </div>
  <div class="sheet-body">
    <table id="checkTable"></table>
    <div class="sign" id="signBox">
      <input id="opr" placeholder="操作者 *">
      <input id="sup" placeholder="督导 *">
      <input id="remark" placeholder="备注（异常说明）">
    </div>
  </div>
  <div class="bar">
    <button class="submit" id="submitBtn" disabled>提交点检</button>
  </div>
</div>

<div class="toast" id="toast"></div>

name": "线材弯折试验机", "items": ["外部表面保持清洁", "开启电源显示屏指示灯是否正常", "按键开关是否正常", "运行是否正常是否异响", "不使用时须关闭电源", "摇摆转动轴是否定期加润滑油"]}, {"id": 15, "code": "NLD-A241", "name": "360度折弯实验机", "items": ["外部表面保持清洁", "开启电源显示屏指示灯是否正常", "按键开关是否正常", "运行是否正常是否异响", "不使用时须关闭电源", "摇摆转动轴是否定期加润滑油"]}, {"id": 16, "code": "NLD-A068", "name": "盐雾试验机", "items": ["外部表面保持清洁", "开启后温度气压是否正常\n->实验室温度：35°\n->压力桶温度：47°\n->喷雾压力：0.1Mpa或14.69psi\n**客户有要求按客户标准进行", "打开喷雾开关喷雾是否正常", "设定测试值是否相符", "箱水位盐雾量盒子水位是否正常", "测试完须打开除雾关闭电源", "量杯每/小时收集喷雾量", "量杯喷雾量，每4小时点检一次"]}, {"id": 17, "code": "NLD-A193", "name": "滚筒跌落试验机", "items": ["外部表面保持清洁", "开启电源后各开关按键是否正常", "运行是否正常是否异响", "测试完须关闭电源", "滚筒转动轴是否定期加润滑油"]}, {"id": 18, "code": "NLD-A220", "name": "冷热冲击试验箱", "items": ["外部表面保持清洁", "开启电源显示屏是否正常", "开启运行是否正常是否有异响", "电源接地线是否良好", "不使用时须关闭电源", "水箱水位是否正常不可过少"]}, {"id": 19, "code": "NLD-A346", "name": "可程式恒温恒湿试验箱", "items": ["外部表面保持清洁", "开启电源显示屏是否正常", "开启运行是否正常是否有异响", "电源接地线是否良好", "不使用时须关闭电源", "水箱水位是否正常不可过少"]}, {"id": 20, "code": "NLD-A194", "name": "模拟运输振动台", "items": ["外部表面保持清洁", "不可放置大于100KG的负载", "调节转速时应缓慢进行", "使用完须关闭电源"]}, {"id": 21, "code": "NLD-A214", "name": "单翼跌落实验机", "items": ["外部表面保持清洁", "开启电源显示屏指示灯是否正常", "按键开关是否正常", "运行是否正常是否异响", "不使用时须关闭电源", "转动轴是否定期加润滑油"]}, {"id": 22, "code": "NLD-B284", "name": "静电放电发生器", "items": ["工作台、仪器是否保持清洁", "清洁工作台、仪器时是否有划伤现象", "仪器运行是否正常", "仪器不要在潮湿条件下使用，以防电击", "仪器长时间不使用时请切断电源"]}, {"id": 23, "code": "NLD-A262", "name": "影像测试仪OMM", "items": ["是否保持工作台清洁", "是否有锋利零件刮伤工作台或刮花玻璃", "测量零件需要把Z-轴调低时，要注意不要让零件顶到镜头，以免影响精度", "移动工作台时不要用力过猛，以免撞伤工作台限位快引起精度下降", "如镜头镜片弄脏，请使用专门镜片清洁剂，而不要使用有机溶液（如酒精、乙醚）擦拭，以免溶解镜头表面镀膜层", "电脑为仪器测试软件专用，请禁止使用“U盘”、禁止连接外网或做其他与本仪器无关的功能使用，如出现故障及时与厂商联系", "本仪器未附任何维修零件，为避免损坏（指测量精确度），请勿任意拆卸所以部件，若需服务请专业或被授权人员联系"]}, {"id": 24, "code": "NLD-A368", "name": "纸带耐磨试验机", "items": ["外部表面保持清洁", "开启电源显示屏指示灯是否正常", "开关柄是否正常", "运行是否正常是否异响", "不使用时须关闭电源", "转动轴是否正常"]}, {"id": 25, "code": "NLD-A374", "name": "紫外光加速老化试验箱", "items": ["外部表面保持清洁", "开启电源显示屏是否正常", "开启运行是否正常是否有异响", "电源接地线是否良好", "不使用时须关闭电源", "水箱水位是否正常不可过少", "灯管是否正常亮起"]}];
var STORE_KEY = "dianjian_records_v2";
var store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
// store[仪器id][日期"YYYY-MM-DD"] = {values:{itemIdx:"v/x/t"}, operator, supervisor, remark}

var curInst = null, curDate = null, curYear, curMonth;
var today = new Date(); today.setHours(0,0,0,0);

// ---- toast ----
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(function(){t.style.display="none"},1600);}

// ---- 存储工具 ----
function getDay(insId, date){ return (store[insId]||{})[date]; }
function setDay(insId, date, obj){
  if(!store[insId]) store[insId]={};
  store[insId][date]=obj;
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}
function dayStatus(insId, date){
  var d=getDay(insId,date); if(!d) return null;
  var vals=d.values||{};
  var hasX=false;
  for(var k in vals){ if(vals[k]==="x") hasX=true; }
  return hasX?"abnormal":"done";
}

// ---- 仪器选择 ----
function renderInstList(filter){
  var box=document.getElementById("instList"); box.innerHTML="";
  var list=INSTRUMENTS.filter(function(ins){
    if(!filter) return true;
    var f=filter.toLowerCase();
    return (ins.code||"").toLowerCase().indexOf(f)>=0 || (ins.name||"").indexOf(filter)>=0;
  });
  list.forEach(function(ins){
    var div=document.createElement("div"); div.className="inst-item";
    div.innerHTML='<div class="t">'+ins.name+'</div><div class="c">'+ins.code+' · '+ins.items.length+'项</div>';
    div.onclick=function(){ selectInst(ins); };
    box.appendChild(div);
  });
}
function selectInst(ins){
  curInst=ins;
  document.getElementById("selTitle").textContent=ins.name;
  document.getElementById("selCode").textContent=ins.code+" · "+ins.items.length+"个点检项";
  document.getElementById("instModal").classList.remove("show");
  document.getElementById("dateCard").style.display="";
  document.getElementById("bar").style.display="";
  curYear=today.getFullYear(); curMonth=today.getMonth()+1;
  syncYM();
  renderCalendar();
}
document.getElementById("selBtn").onclick=function(){
  renderInstList(document.getElementById("instSearch").value.trim());
  document.getElementById("instModal").classList.add("show");
};
document.getElementById("instClose").onclick=function(){document.getElementById("instModal").classList.remove("show");};
document.getElementById("instSearch").oninput=function(e){renderInstList(e.target.value.trim());};

// ---- 年月 ----
function fillYM(){
  var ys=document.getElementById("yearSel"), ms=document.getElementById("monthSel");
  for(var y=2024;y<=2030;y++){var o=document.createElement("option");o.value=y;o.textContent=y+"年";ys.appendChild(o);}
  for(var m=1;m<=12;m++){var o=document.createElement("option");o.value=m;o.textContent=m+"月";ms.appendChild(o);}
}
function syncYM(){
  document.getElementById("yearSel").value=curYear;
  document.getElementById("monthSel").value=curMonth;
}
document.getElementById("yearSel").onchange=function(e){curYear=+e.target.value;renderCalendar();};
document.getElementById("monthSel").onchange=function(e){curMonth=+e.target.value;renderCalendar();};
document.getElementById("todayBtn").onclick=function(e){
  e.preventDefault(); curYear=today.getFullYear(); curMonth=today.getMonth()+1; syncYM(); renderCalendar();
};

// ---- 日历 ----
function renderCalendar(){
  var grid=document.getElementById("grid");
  // 保留前7个星期头
  while(grid.children.length>7) grid.removeChild(grid.lastChild);
  var first=new Date(curYear,curMonth-1,1);
  var startWeek=first.getDay();
  var days=new Date(curYear,curMonth,0).getDate();
  for(var i=0;i<startWeek;i++){var e=document.createElement("div");e.className="day empty";grid.appendChild(e);}
  for(var d=1;d<=days;d++){
    var e=document.createElement("div");
    var thisDate=new Date(curYear,curMonth-1,d);
    var dateStr=curYear+"-"+(String(curMonth).padStart(2,"0"))+"-"+String(d).padStart(2,"0");
    e.className="day";
    if(thisDate>today) e.classList.add("future");
    else e.classList.add("past");
    if(isSameDay(thisDate,today)) e.classList.add("today");
    var st=curInst?dayStatus(curInst.id,dateStr):null;
    if(st) e.classList.add(st);
    e.textContent=d;
    if(thisDate<=today){
      e.onclick=(function(ds){return function(){openSheet(ds);};})(dateStr);
    }
    grid.appendChild(e);
  }
}
function isSameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

// ---- 点检弹层 ----
var curValues={};
function openSheet(dateStr){
  curDate=dateStr;
  curValues={};
  var existing=getDay(curInst.id,dateStr);
  if(existing) curValues=JSON.parse(JSON.stringify(existing.values||{}));
  document.getElementById("sheetInfo").innerHTML=
    "<b>"+curInst.name+"</b><br>"+curInst.code+" · "+dateStr;
  buildTable();
  document.getElementById("opr").value=(existing&&existing.operator)||"";
  document.getElementById("sup").value=(existing&&existing.supervisor)||"";
  document.getElementById("remark").value=(existing&&existing.remark)||"";
  document.getElementById("sheet").classList.add("show");
  refreshSubmit();
}
function buildTable(){
  var tbl=document.getElementById("checkTable");
  var html="<thead><tr><th style='width:44%'>点检项目</th><th>√<br>正常</th><th>×<br>异常</th><th>△<br>其它</th></tr></thead><tbody>";
  curInst.items.forEach(function(it,idx){
    var v=curValues[idx]||"";
    html+="<tr><td class='item'>"+(idx+1)+". "+escapeHtml(it)+"</td>"+
      "<td><button class='v "+(v==="v"?"on-v":"")+"' data-v='v' data-i='"+idx+"'>√</button></td>"+
      "<td><button class='x "+(v==="x"?"on-x":"")+"' data-v='x' data-i='"+idx+"'>×</button></td>"+
      "<td><button class='t "+(v==="t"?"on-t":"")+"' data-v='t' data-i='"+idx+"'>△</button></td></tr>";
  });
  html+="</tbody>";
  tbl.innerHTML=html;
  tbl.querySelectorAll(".pick button").forEach(function(btn){
    btn.onclick=function(){
      var i=btn.getAttribute("data-i"), v=btn.getAttribute("data-v");
      if(curValues[i]===v) delete curValues[i];
      else curValues[i]=v;
      buildTable(); refreshSubmit();
    };
  });
}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function allFilled(){
  for(var i=0;i<curInst.items.length;i++){ if(!curValues[i]) return false; }
  return true;
}
function refreshSubmit(){
  document.getElementById("submitBtn").disabled=!allFilled();
  document.getElementById("signBox").classList.toggle("show",allFilled());
}
document.getElementById("sheetClose").onclick=function(){document.getElementById("sheet").classList.remove("show");renderCalendar();};
document.getElementById("submitBtn").onclick=function(){
  var opr=document.getElementById("opr").value.trim();
  var sup=document.getElementById("sup").value.trim();
  if(!opr||!sup){toast("请填写操作者和督导");return;}
  setDay(curInst.id,curDate,{values:curValues,operator:opr,supervisor:sup,remark:document.getElementById("remark").value.trim()});
  toast("已提交 "+curDate);
  document.getElementById("sheet").classList.remove("show");
  renderCalendar();
};

// ---- 导出 Excel (CSV，兼容中文) ----
document.getElementById("exportBtn").onclick=function(){
  if(!curInst){toast("请先选择仪器");return;}
  var rows=[];
  var header=["日期","操作者","督导","备注"];
  curInst.items.forEach(function(it,i){header.push((i+1)+"."+it.replace(/[,\r\n]/g," "));});
  rows.push(header);
  var days=store[curInst.id]||{};
  Object.keys(days).sort().forEach(function(date){
    var d=days[date];
    var r=[date,d.operator||"",d.supervisor||"",(d.remark||"").replace(/[,\r\n]/g," ")];
    curInst.items.forEach(function(it,i){var v=d.values&&d.values[i];r.push(v?v==="v"?"√":v==="x"?"×":"△":"·");});
    rows.push(r);
  });
  if(rows.length===1){toast("本月无点检记录");return;}
  var BOM="\uFEFF";
  var csv=BOM+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=curInst.code+"_"+curInst.name+"_点检记录_"+curYear+"-"+String(curMonth).padStart(2,"0")+".csv";
  a.click();
};

// ---- 启动 ----
document.getElementById("selTitle").textContent="请选择仪器（共 "+INSTRUMENTS.length+" 台）";
fillYM();
</script>
